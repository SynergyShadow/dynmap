  implementation project(path: ':DynmapCore', configuration: 'shadow')
  compileOnly group: 'org.spigotmc', name: 'spigot-api', version:'26.1-R0.1-SNAPSHOT'
  compileOnly group: 'org.spigotmc', name: 'spigot', version:'26.1-R0.1-SNAPSHOT'
}
